<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Clock · Design preview</title>
<style>
:root{color-scheme:light;--paper:#eeeae1;--ink:#30383b;--line:#30383b25}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;transition:background .3s,color .3s}canvas{display:block;width:100vw;height:100vh;height:100dvh}header{position:fixed;top:30px;left:36px;pointer-events:none}h1{font-size:13px;font-weight:500;letter-spacing:.23em;margin:0}header p{font-size:11px;letter-spacing:.08em;opacity:.5;margin-top:10px}.tools{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:24px;padding:15px 22px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(20px);white-space:nowrap}header,.tools{transition:opacity .5s}.rest header,.rest .tools{opacity:0;pointer-events:none}.tools:focus-within{opacity:1;pointer-events:auto}label{display:flex;flex-direction:column;gap:8px;font-size:9px;letter-spacing:.15em;text-transform:uppercase}select{max-width:128px;background:transparent;border:0;color:inherit;font:12px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;padding:0}option{color:#30383b;background:#eeeae1}.swatches{display:flex;gap:7px}button{cursor:pointer;color:inherit}.swatch{width:19px;height:19px;border:1px solid #0002;border-radius:50%;background:var(--swatch);padding:0}.swatch[aria-pressed=true]{outline:1px solid var(--ink);outline-offset:3px}.divider{width:1px;height:32px;background:var(--line)}input[type=range]{width:90px;height:14px;accent-color:var(--ink);margin:0}#fullscreen{border:0;background:none;padding:6px;width:30px;height:30px;font-size:20px}#hint{position:fixed;right:34px;top:31px;font-size:11px;opacity:.45;transition:opacity .5s}.rest #hint{opacity:0}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:5px}#clock-time{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:650px){header{left:22px;top:22px}#hint{display:none}.tools{bottom:16px;gap:16px;padding:14px 18px}.divider,.size-setting{display:none}.swatches{gap:8px}.swatch{width:17px;height:17px}select{max-width:86px}label{font-size:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>ATELIER CLOCK</h1><p>A study in time and proportion.</p></header>
<span id="hint">Controls fade when idle · F for full screen</span>
<canvas id="clock" role="img" aria-label="Analog clock showing current local time" aria-describedby="clock-time"></canvas><time id="clock-time"></time>
<div class="tools" aria-label="Clock settings">
<label>Dial<span class="swatches" id="swatches"></span></label><span class="divider"></span>
<label>Movement<select id="movement"><option value="0">Smooth</option><option value="1">Mechanical</option><option value="2">Quartz</option></select></label>
<label class="size-setting">Size<input id="size" aria-label="Clock size" type="range" min=".45" max=".92" step=".01" value=".84"></label>
<button id="fullscreen" title="Toggle full screen (F)" aria-label="Toggle full screen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
</div>
<script>
'use strict';
const themes=[['Paper','#eeeae1'],['Sage','#d5ded6'],['Lavender','#d3d7ec'],['Terracotta','#e9baaa'],['Ochre','#e5c664'],['Night','#161b1e']];
let saved={};try{saved=JSON.parse(localStorage.getItem('atelier-preview')||'{}')||{}}catch{}
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)'),reduced=reducedMotion.matches;
let palette=Number.isInteger(saved.palette)?Math.max(0,Math.min(5,saved.palette)):0;
let movement=Number.isInteger(saved.movement)?Math.max(0,Math.min(2,saved.movement)):(reduced?2:0);
let scale=Number.isFinite(saved.scale)?Math.max(.45,Math.min(.92,saved.scale)):.84;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),dial=document.createElement('canvas'),dc=dial.getContext('2d');
const fadeCanvas=document.createElement('canvas'),fadeContext=fadeCanvas.getContext('2d'),displayStart=performance.now();
let width=innerWidth,height=innerHeight,ratio=1,cacheKey='',lastFrame=0,lastSecond=-1;
const save=()=>{try{localStorage.setItem('atelier-preview',JSON.stringify({palette,movement,scale}))}catch{}};
function setTheme(i){palette=i;document.documentElement.style.setProperty('--paper',themes[i][1]);document.documentElement.style.setProperty('--ink',i===5?'#cbd9cd':'#30383b');document.documentElement.style.setProperty('--line',i===5?'#cbd9cd25':'#30383b25');document.querySelectorAll('.swatch').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));save()}
themes.forEach(([name,color],i)=>{const b=document.createElement('button');b.className='swatch';b.style.setProperty('--swatch',color);b.title=name;b.setAttribute('aria-label',name+' dial');b.onclick=()=>setTheme(i);document.querySelector('#swatches').append(b)});
setTheme(palette);document.querySelector('#movement').value=movement;document.querySelector('#size').value=scale;
document.querySelector('#movement').onchange=e=>{movement=Number(e.target.value);save()};document.querySelector('#size').oninput=e=>{scale=Number(e.target.value);save()};
function resize(){width=innerWidth;height=innerHeight;ratio=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);cacheKey=''}addEventListener('resize',resize);resize();
function line(c,x1,y1,x2,y2,w,color){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=w;c.lineCap='round';c.strokeStyle=color;c.stroke()}
function radial(c,r1,r2,a,w,color){line(c,Math.sin(a)*r1,-Math.cos(a)*r1,Math.sin(a)*r2,-Math.cos(a)*r2,w,color)}
function text(c,s,x,y,size,color){c.fillStyle=color;c.font=`400 ${size}px "Avenir Next", "Century Gothic", sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(s,x,y)}
function staticDial(c,dark){const ink=dark?'#cbd9cd':'#30383b',muted=dark?'#cbd9cd7a':'#30383b7a';for(let i=0;i<60;i++)if(i%5)radial(c,257,271,i*Math.PI/30,1.8,muted);for(let i=0;i<12;i++){const a=i*Math.PI/6;c.save();c.shadowOffsetX=1.3;c.shadowOffsetY=2;c.shadowBlur=3;c.shadowColor=dark?'#0008':'#0003';radial(c,232,271,a,9,dark?'#48524e':'#aaa99f');c.restore();radial(c,232,271,a,7,dark?'#68766b':'#fff');radial(c,235,269,a,3.6,dark?'#c5e5cd':'#fffef5');text(c,String(i||12),Math.sin(a)*184,-Math.cos(a)*184,35,ink);c.save();c.rotate(a);text(c,String(i?i*5:60).padStart(2,'0'),0,-301,16,muted);c.restore()}}
function hand(c,a,length,w,dark){c.save();c.rotate(a);c.beginPath();c.moveTo(-w/2,25);c.lineTo(-w/2,-length+17);c.lineTo(-2,-length);c.lineTo(2,-length);c.lineTo(w/2,-length+17);c.lineTo(w/2,25);c.closePath();c.save();c.shadowOffsetX=3;c.shadowOffsetY=4;c.shadowBlur=5;c.shadowColor=dark?'#0008':'#0004';c.fillStyle=dark?'#66726b':'#414847';c.fill();c.restore();c.strokeStyle=dark?'#91a396':'#c6c7be';c.lineWidth=.7;c.stroke();line(c,0,-34,0,-length+24,w*.4,dark?'#c5e5cd':'#f6f4df');c.restore()}
function dot(c,r,color){c.beginPath();c.arc(0,0,r,0,2*Math.PI);c.fillStyle=color;c.fill()}
function displayShift(elapsed,reduce){
 const positions=[[0,0],[.8,.6],[-.6,.8],[-.8,-.6],[.6,-.8]];
 elapsed=Math.max(0,elapsed);const cycle=Math.floor(elapsed/300),index=cycle%5;
 if(!cycle)return {from:positions[0],to:positions[0],mix:0};
 const t=reduce?1:Math.min(1,(elapsed-cycle*300)/10);
 return {from:positions[(index+4)%5],to:positions[index],mix:t*t*(3-2*t)};
}
function drawScene(c,offset,now,seconds,dark,unit){
 const radius=Math.min(width,height)*.012;
 c.setTransform(ratio,0,0,ratio,0,0);c.fillStyle=themes[palette][1];c.fillRect(0,0,width,height);
 c.translate(width/2+offset[0]*radius,height/2-offset[1]*radius);c.scale(unit,unit);
 c.drawImage(dial,-320,-320,640,640);
 hand(c,((now.getHours()%12)+now.getMinutes()/60+seconds/3600)*Math.PI/6,166,13,dark);hand(c,(now.getMinutes()+seconds/60)*Math.PI/30,254,9,dark);
 const s=movement===1?Math.floor(seconds*8)/8:movement===2?Math.floor(seconds):seconds;
 c.save();c.shadowOffsetX=2;c.shadowOffsetY=3;c.shadowBlur=3;c.shadowColor='#0003';radial(c,-54,272,s*Math.PI/30,2.1,dark?'#e6ac77':'#b94b31');c.restore();dot(c,11,dark?'#536357':'#c9cac2');dot(c,7,dark?'#b5c4b7':'#f9f7ed');dot(c,3,dark?'#e6ac77':'#b94b31');
}
function frame(stamp){requestAnimationFrame(frame);if(document.hidden||stamp-lastFrame<1000/30)return;lastFrame=stamp;
 const now=new Date(),seconds=now.getSeconds()+now.getMilliseconds()/1000,dark=palette===5;
 const diameter=Math.min(width,height)*scale,unit=diameter/640;
 const key=`${palette}-${diameter}-${ratio}`;if(key!==cacheKey){const pixels=Math.max(640,Math.ceil(diameter*ratio));dial.width=dial.height=pixels;dc.setTransform(pixels/640,0,0,pixels/640,pixels/2,pixels/2);staticDial(dc,dark);cacheKey=key}
 const shift=displayShift((stamp-displayStart)/1000,reducedMotion.matches);
 drawScene(ctx,shift.mix>=1?shift.to:shift.from,now,seconds,dark,unit);
 if(shift.mix>0&&shift.mix<1){
  if(fadeCanvas.width!==canvas.width||fadeCanvas.height!==canvas.height){fadeCanvas.width=canvas.width;fadeCanvas.height=canvas.height}
  drawScene(fadeContext,shift.to,now,seconds,dark,unit);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=shift.mix;ctx.drawImage(fadeCanvas,0,0);ctx.restore();
 }
 if(lastSecond!==now.getSeconds()){const t=document.querySelector('#clock-time');t.textContent=now.toLocaleTimeString();t.dateTime=now.toISOString();lastSecond=now.getSeconds()}
}
requestAnimationFrame(frame);
let idle;function wake(){document.body.classList.remove('rest');clearTimeout(idle);idle=setTimeout(()=>{if(!document.querySelector('.tools').contains(document.activeElement))document.body.classList.add('rest')},4500)}
['pointermove','pointerdown','keydown','focusin'].forEach(e=>addEventListener(e,wake,{passive:true}));wake();
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else document.querySelector('#hint').textContent='Use your browser’s full-screen command.'}catch{document.querySelector('#hint').textContent='Use your browser’s full-screen command.'}}
document.querySelector('#fullscreen').onclick=fullscreen;addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!e.metaKey&&!e.ctrlKey&&!['INPUT','SELECT'].includes(e.target.tagName))fullscreen()});
</script>
</body>
</html>
